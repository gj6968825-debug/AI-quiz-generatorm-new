
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Science Quiz Generator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#101c40,#235b82);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 650px;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px #0005;
}

h1 {
    text-align: center;
    color: #174c83;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

.progress {
    height: 10px;
    background: #ddd;
    border-radius: 10px;
    margin-bottom: 20px;
}

#progressBar {
    height: 10px;
    width: 0%;
    background: #1685e8;
    border-radius: 10px;
}

#question {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 20px;
    color: #222;
}

.option {
    display: block;
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 2px solid #ddd;
    background: #f7faff;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    font-size: 16px;
}

.option:hover {
    background: #e1efff;
}

.option.selected {
    background: #d2e8ff;
    border-color: #1685e8;
}

.option:disabled {
    cursor: not-allowed;
}

button {
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #176ac1;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin-top: 15px;
}

button:hover {
    background: #104d91;
}

#nextBtn {
    display: none;
    width: 100%;
}

#result {
    display: none;
    text-align: center;
}

#result h2 {
    color: #176ac1;
    margin: 20px;
}

#score {
    font-size: 30px;
    color: green;
    margin: 20px;
}

#feedback {
    margin: 15px 0;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

<h1>🧪 AI Science Quiz</h1>
<p class="subtitle">विज्ञान के 10 मजेदार प्रश्नों का टेस्ट</p>

<div id="quiz">

<div class="progress">
<div id="progressBar"></div>
</div>

<p id="questionNumber">प्रश्न 1 / 10</p>

<div id="question"></div>

<div id="options"></div>

<p id="feedback"></p>

<button id="nextBtn" onclick="nextQuestion()">
अगला प्रश्न ➜
</button>

</div>

<div id="result">
<h2>🎉 आपका रिजल्ट</h2>
<p id="score"></p>
<p id="message"></p>
<button onclick="restartQuiz()">दोबारा टेस्ट दें</button>
</div>

</div>

<script>

const questions = [

{
q: "सूर्य के सबसे निकट कौन सा ग्रह है?",
a: ["पृथ्वी", "बुध", "मंगल", "शुक्र"],
correct: 1
},

{
q: "पानी का रासायनिक सूत्र क्या है?",
a: ["CO2", "O2", "H2O", "NaCl"],
correct: 2
},

{
q: "मनुष्य के शरीर में कितने हृदय होते हैं?",
a: ["एक", "दो", "तीन", "चार"],
correct: 0
},

{
q: "पौधे अपना भोजन किस प्रक्रिया से बनाते हैं?",
a: ["श्वसन", "प्रकाश संश्लेषण", "पाचन", "वाष्पीकरण"],
correct: 1
},

{
q: "लाल ग्रह किसे कहा जाता है?",
a: ["शुक्र", "बृहस्पति", "मंगल", "शनि"],
correct: 2
},

{
q: "हवा में सबसे अधिक कौन सी गैस होती है?",
a: ["ऑक्सीजन", "नाइट्रोजन", "कार्बन डाइऑक्साइड", "हाइड्रोजन"],
correct: 1
},

{
q: "मानव शरीर की सबसे बड़ी हड्डी कौन सी है?",
a: ["फीमर", "टिबिया", "ह्यूमरस", "रेडियस"],
correct: 0
},

{
q: "पृथ्वी का प्राकृतिक उपग्रह कौन है?",
a: ["सूर्य", "मंगल", "चंद्रमा", "शुक्र"],
correct: 2
},

{
q: "बिजली के बल्ब का फिलामेंट सामान्यतः किस धातु का बना होता है?",
a: ["तांबा", "लोहा", "टंगस्टन", "एल्युमिनियम"],
correct: 2
},

{
q: "ध्वनि किस माध्यम में यात्रा नहीं कर सकती?",
a: ["हवा", "पानी", "ठोस", "निर्वात"],
correct: 3
}

];

let current = 0;
let score = 0;
let selected = false;

function loadQuestion() {

    selected = false;

    document.getElementById("feedback").innerText = "";
    document.getElementById("nextBtn").style.display = "none";

    let q = questions[current];

    document.getElementById("questionNumber").innerText =
    "प्रश्न " + (current + 1) + " / " + questions.length;

    document.getElementById("progressBar").style.width =
    (current / questions.length * 100) + "%";

    document.getElementById("question").innerText = q.q;

    let optionsHTML = "";

    q.a.forEach((option, index) => {
        optionsHTML += `
        <button class="option" onclick="checkAnswer(${index}, this)">
        ${String.fromCharCode(65 + index)}. ${option}
        </button>`;
    });

    document.getElementById("options").innerHTML = optionsHTML;
}

function checkAnswer(index, button) {

    if (selected) return;

    selected = true;

    let q = questions[current];
    let buttons = document.querySelectorAll(".option");

    buttons.forEach((btn, i) => {
        btn.disabled = true;

        if (i === q.correct) {
            btn.style.background = "#b8f5c4";
            btn.style.borderColor = "green";
        }
    });

    if (index === q.correct) {
        score++;
        document.getElementById("feedback").innerText =
        "✅ बहुत अच्छा! आपका जवाब सही है।";
        document.getElementById("feedback").style.color = "green";
    } else {
        document.getElementById("feedback").innerText =
        "❌ गलत जवाब! हरे रंग में सही उत्तर दिखाया गया है।";
        document.getElementById("feedback").style.color = "red";
    }

    document.getElementById("nextBtn").style.display = "block";

    if (current === questions.length - 1) {
        document.getElementById("nextBtn").innerText = "रिजल्ट देखें";
    }
}

function nextQuestion() {

    current++;

    if (current < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {

    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("progressBar").style.width = "100%";

    document.getElementById("score").innerText =
    score + " / " + questions.length;

    let percentage = score * 10;

    let message = "";

    if (percentage >= 80) {
        message = "🏆 शानदार! आप विज्ञान में बहुत अच्छे हैं।";
    } else if (percentage >= 50) {
        message = "👍 अच्छा प्रयास! और अभ्यास करें।";
    } else {
        message = "📚 और पढ़ाई करें, आप बेहतर कर सकते हैं।";
    }

    document.getElementById("message").innerText = message;
}

function restartQuiz() {

    current = 0;
    score = 0;

    document.getElementById("result").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    document.getElementById("nextBtn").innerText = "अगला प्रश्न ➜";

    loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
