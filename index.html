
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Science Quiz Generator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #001f54, #1769ff, #8b5cf6);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: rgba(255,255,255,0.97);
    width: 100%;
    max-width: 650px;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 15px 40px #00143d80;
    animation: appear 0.8s ease;
}

@keyframes appear {
    from {opacity: 0; transform: translateY(30px);}
    to {opacity: 1; transform: translateY(0);}
}

h1 {
    text-align: center;
    color: #1748b5;
    margin-bottom: 10px;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 25px;
}

.progress {
    height: 12px;
    background: #dbeafe;
    border-radius: 20px;
    margin: 20px 0;
    overflow: hidden;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#1769ff,#9333ea);
    transition: width 0.4s;
}

#questionNumber {
    color: #1769ff;
    font-weight: bold;
    margin-bottom: 15px;
}

#question {
    font-size: 21px;
    font-weight: bold;
    color: #172554;
    margin-bottom: 20px;
    line-height: 1.5;
}

.option {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 12px 0;
    border: 2px solid #bfdbfe;
    background: blue;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    font-size: 16px;
    transition: 0.3s;
    color: #1e3a8a;
}

.option:hover:not(:disabled) {
    background: #dbeafe;
    border-color: #1769ff;
    transform: translateX(5px);
}

.option:disabled {
    cursor: not-allowed;
}

button.main {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg,#1769ff,#9333ea);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
    box-shadow: 0 5px 15px #1769ff55;
    transition: 0.3s;
}

button.main:hover {
    transform: scale(1.03);
    box-shadow: 0 8px 20px #1769ff77;
}

#feedback {
    font-weight: bold;
    margin-top: 15px;
}

#result {
    display: none;
    text-align: center;
}

#result h2 {
    color: #1769ff;
    font-size: 28px;
    margin: 20px;
}

#score {
    font-size: 45px;
    color: #6d28d9;
    font-weight: bold;
    margin: 20px;
}

</style>
</head>

<body>

<div class="container">

<h1>🧪 Science Quiz</h1>
<p class="subtitle">✨ Test Your Science Knowledge ✨</p>

<div id="quiz">

<div class="progress">
<div id="progressBar"></div>
</div>

<p id="questionNumber"></p>
<div id="question"></div>
<div id="options"></div>
<p id="feedback"></p>

<button class="main" id="nextBtn"
onclick="nextQuestion()" style="display:none">
Next Question ➜
</button>

</div>

<div id="result">
<h2>🎉 Quiz Completed!</h2>
<p>Your Score</p>
<div id="score"></div>
<p id="message"></p>

<button class="main" onclick="restartQuiz()">
🔄 Play Again
</button>
</div>

</div>

<script>

const questions = [
{
q:"सूर्य के सबसे निकट कौन सा ग्रह है?",
a:["पृथ्वी","बुध","मंगल","शुक्र"],
correct:1
},
{
q:"पानी का रासायनिक सूत्र क्या है?",
a:["CO2","O2","H2O","NaCl"],
correct:2
},
{
q:"मनुष्य के शरीर में कितने हृदय होते हैं?",
a:["एक","दो","तीन","चार"],
correct:0
},
{
q:"पौधे अपना भोजन किस प्रक्रिया से बनाते हैं?",
a:["श्वसन","प्रकाश संश्लेषण","पाचन","वाष्पीकरण"],
correct:1
},
{
q:"लाल ग्रह किसे कहा जाता है?",
a:["शुक्र","बृहस्पति","मंगल","शनि"],
correct:2
},
{
q:"हवा में सबसे अधिक कौन सी गैस होती है?",
a:["ऑक्सीजन","नाइट्रोजन","कार्बन डाइऑक्साइड","हाइड्रोजन"],
correct:1
},
{
q:"मानव शरीर की सबसे बड़ी हड्डी कौन सी है?",
a:["फीमर","टिबिया","ह्यूमरस","रेडियस"],
correct:0
},
{
q:"पृथ्वी का प्राकृतिक उपग्रह कौन है?",
a:["सूर्य","मंगल","चंद्रमा","शुक्र"],
correct:2
},
{
q:"बिजली के बल्ब का फिलामेंट सामान्यतः किसका बना होता है?",
a:["तांबा","लोहा","टंगस्टन","एल्युमिनियम"],
correct:2
},
{
q:"ध्वनि किस माध्यम में यात्रा नहीं कर सकती?",
a:["हवा","पानी","ठोस","निर्वात"],
correct:3
}
];

let current = 0;
let score = 0;
let selected = false;

function loadQuestion() {

selected = false;

document.getElementById("feedback").innerText = "";
document.getElementById("nextBtn").style.display = "none";

let q = questions[current];

document.getElementById("questionNumber").innerText =
"Question " + (current+1) + " / 10";

document.getElementById("progressBar").style.width =
(current/questions.length*100) + "%";

document.getElementById("question").innerText = q.q;

let html = "";

q.a.forEach((option,index)=>{
html += `<button class="option"
onclick="checkAnswer(${index})">
${String.fromCharCode(65+index)}. ${option}
</button>`;
});

document.getElementById("options").innerHTML = html;
}

function checkAnswer(index) {

if(selected) return;

selected = true;

let q = questions[current];
let buttons = document.querySelectorAll(".option");

buttons.forEach((btn,i)=>{
btn.disabled = true;

if(i === q.correct){
btn.style.background = "#bbf7d0";
btn.style.borderColor = "#16a34a";
btn.style.color = "#14532d";
}
});

if(index === q.correct){
score++;
document.getElementById("feedback").innerText =
"🎉 Excellent! आपका जवाब सही है!";
document.getElementById("feedback").style.color = "green";
}
else{
document.getElementById("feedback").innerText =
"❌ गलत जवाब! हरे रंग में सही उत्तर देखें।";
document.getElementById("feedback").style.color = "red";
}

document.getElementById("nextBtn").style.display = "block";

if(current === questions.length-1){
document.getElementById("nextBtn").innerText = "🏆 Show Result";
}
}

function nextQuestion(){

current++;

if(current < questions.length){
document.getElementById("nextBtn").innerText = "Next Question ➜";
loadQuestion();
}
else{
showResult();
}
}

function showResult(){

document.getElementById("quiz").style.display = "none";
document.getElementById("result").style.display = "block";

document.getElementById("progressBar").style.width = "100%";

document.getElementById("score").innerText =
score + " / 10";

let percent = score*10;

document.getElementById("message").innerText =
percent >= 80 ? "🏆 Amazing! You are a Science Champion!" :
percent >= 50 ? "👍 Good Job! Keep Practicing!" :
"📚 Keep Learning! You Can Do Better!";
}

function restartQuiz(){

current = 0;
score = 0;

document.getElementById("result").style.display = "none";
document.getElementById("quiz").style.display = "block";

document.getElementById("nextBtn").innerText = "Next Question ➜";

loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
